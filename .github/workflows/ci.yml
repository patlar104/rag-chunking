name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly, catches breakage from new upstream releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install ruff
      - run: ruff check . --output-format=github
      - run: ruff format --check .
      - name: JavaScript syntax
        run: node --check webui/static/app.js
      - name: CHANGELOG has an entry for the pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::add a '## [$version]' section"; exit 1; }
          echo "CHANGELOG.md has [$version]"

  core:
    name: Core · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.13", "3.14", "3.15"]   # minimum 3.13; 3.15 recommended
        include:
          - { os: macos-latest, python: "3.15" }
          - { os: windows-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Unit tests (zero dependencies)
        env:
          CHUNKING_CACHE_DIR: ${{ runner.temp }}/chunk-cache
        run: python -m unittest discover -s tests -v

  integrations:
    name: Integrations + web UI · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Full test suite (LangChain, LlamaIndex, FastAPI)
        env:
          CHUNKING_CACHE_DIR: ${{ runner.temp }}/chunk-cache
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Smoke test the dashboard server (public mode)
        run: |
          python -m webui.server --port 8000 --public > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health > /dev/null && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q "Chunk Monitor"
          id=$(curl -fs -X POST localhost:8000/api/runs -H 'content-type: application/json' \
               -d '{"text": "Cats sleep a lot. They groom often. Rust is memory safe. It compiles natively.", "strategies": ["fixed", "semantic", "agentic"], "stability": true}' \
               | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 30); do
            status=$(curl -fs localhost:8000/api/runs/$id | python -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$status" = done ] && break; sleep 1
          done
          echo "run $id: $status"; [ "$status" = done ]
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/settings -H 'content-type: application/json' -d '{"embed":"hashing","llm":"none"}')" = 403
      - name: Server log
        if: failure()
        run: cat server.log || true

  old-python-guard:
    name: Clear error on Python < 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          out=$(python -c "import chunking" 2>&1) && { echo "import should fail on 3.12"; exit 1; }
          echo "$out" | grep -q "needs Python 3.13 or newer" || { echo "$out"; exit 1; }
          pip install . 2>&1 | grep -qi "requires a different Python" && echo "pip refuses 3.12 as expected"

  package:
    name: Build + install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "
          import chunking, webui, pathlib
          from chunking import get_chunker
          assert get_chunker('recursive', chunk_size=20).split('One sentence. Another one here. And a third.')
          assert (pathlib.Path(webui.__file__).parent / 'static' / 'app.js').exists(), 'static files missing from wheel'
          print('wheel OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
